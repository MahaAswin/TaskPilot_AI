<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskPilot AI | Your Intelligent Productivity Co-Pilot</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-textPrimary antialiased selection:bg-primary/30 selection:text-white min-h-screen">
    <div id="root"></div>
    <!-- Mermaid CDN for diagramming -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
    <script>
      // Initialize mermaid on load
      setTimeout(() => {
        if (window.mermaid) {
          window.mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            themeVariables: {
              background: '#18181b',
              primaryColor: '#6366f1',
              secondaryColor: '#d946ef',
              textColor: '#f4f4f5'
            }
          });
        }
      }, 500);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
